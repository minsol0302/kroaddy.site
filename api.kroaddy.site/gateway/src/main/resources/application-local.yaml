# 로컬 개발 환경 설정
# 사용법: SPRING_PROFILES_ACTIVE=local로 실행

spring:
  application:
    name: gateway
  server:
    port: 8080
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            # === Java 서비스 (로컬 포트) ===
            # Auth-service 라우팅
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            # Log-service 라우팅
            - id: log-service
              uri: ${LOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/log/**

            # ML-service 라우팅
            - id: ml-service
              uri: ${ML_SERVICE_URL:http://localhost:9010}
              predicates:
                - Path=/api/ml/**
              filters:
                - StripPrefix=2

            # === Python 서비스 (로컬 포트) ===
            # Feed 서비스
            - id: feed-service
              uri: ${FEED_SERVICE_URL:http://localhost:9003}
              predicates:
                - Path=/api/feed/**
              filters:
                - StripPrefix=2

            # RAG 서비스
            - id: rag-service
              uri: ${RAG_SERVICE_URL:http://localhost:9002}
              predicates:
                - Path=/api/rag/**
              filters:
                - StripPrefix=2

            # Chatbot 서비스
            - id: chatbot-service
              uri: ${CHATBOT_SERVICE_URL:http://localhost:9004}
              predicates:
                - Path=/api/chatbot/**
              filters:
                - StripPrefix=2

            # Agent 서비스 (Python Gateway)
            - id: agent-service
              uri: ${AGENT_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/agent/**
              filters:
                - StripPrefix=2

            # 루트 경로를 /docs로 리다이렉트
            - id: root-redirect
              uri: http://localhost:8080
              predicates:
                - Path=/
              filters:
                - RedirectTo=302, /docs
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Gateway는 Eureka 사용하지 않음
eureka:
  client:
    enabled: false

# Swagger / Springdoc 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

# 로깅 설정
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    site.protoa.api: DEBUG

